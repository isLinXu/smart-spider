[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-spider"
version = "2.2.0"
description = "多模态智能爬虫：基于 CLIP 语义过滤，支持图片/视频/文本采集，内置完整反爬体系"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    # 网络请求（核心）
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "fake-useragent>=1.4.0",
    # 日志 & 进度条
    "loguru>=0.6.0",
    "tqdm>=4.64.0",
    # 图像处理
    "Pillow>=9.0.0",
    "numpy>=1.21.0",
    # 深度学习核心（CLIP 依赖）
    "torch>=1.13.0",
    "torchvision>=0.14.0",
]

[project.optional-dependencies]
# 动态渲染（反爬 SPA 页面）
browser = [
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
]
# 视频下载
video = [
    "yt-dlp>=2023.11.16",
]
# 文本提取
text = [
    "trafilatura>=1.6.0",
]
# TLS 指纹伪造（绕过 Cloudflare 等）
tls = [
    "curl_cffi>=0.6.0",
]
# URL 去重（BloomFilter，内存效率高）
dedup = [
    "pybloom-live>=3.0.0",
]
# 离线广告/语义过滤；OCR 还需要系统安装 tesseract 可执行文件
filter = [
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
    "transformers>=4.40.0",
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.18.0",
    "ultralytics>=8.3.0",
]
# 开发工具
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "PyYAML>=6.0",
]
# 配置文件 YAML
config = [
    "PyYAML>=6.0",
]
# 全功能安装
all = [
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "yt-dlp>=2023.11.16",
    "trafilatura>=1.6.0",
    "curl_cffi>=0.6.0",
    "pybloom-live>=3.0.0",
    "opencv-python-headless>=4.8.0",
    "pytesseract>=0.3.10",
    "transformers>=4.40.0",
    "huggingface-hub>=0.24.0",
    "onnxruntime>=1.18.0",
    "ultralytics>=8.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "redis>=5.0.0",
    "boto3>=1.34.0",
    "PyYAML>=6.0",
]
# 轻量任务 API
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]
# 分布式队列 / 对象存储插件
redis = [
    "redis>=5.0.0",
]
s3 = [
    "boto3>=1.34.0",
]

[project.scripts]
smart-spider = "spider:main"
smart-spider-multimodal = "smart_spider.multimodal_cli:main"
smart-spider-image-search = "smart_spider.image_search_cli:main"
smart-spider-reverse-image-search = "smart_spider.reverse_image_search_cli:main"
smart-spider-filter = "smart_spider.dataset_filter_cli:main"
smart-spider-quality-validate = "smart_spider.quality_validation_cli:main"
smart-spider-api = "smart_spider.api:main"
smart-spider-worker = "smart_spider.worker:main"
smart-spider-db-stats = "smart_spider.db_stats_cli:main"
smart-spider-browse = "smart_spider.browse_cli:main"

[tool.setuptools]
py-modules = ["spider", "crawl_dataset", "crawl_multimodal"]

[tool.setuptools.packages.find]
where = ["."]
include = ["smart_spider*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["smart_spider"]
omit = ["tests/*", "examples/*", "spider.py"]

[tool.coverage.report]
show_missing = true

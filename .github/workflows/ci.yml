name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: "Test (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: |
          pip install --upgrade pip
          # 安装测试所需最小依赖（跳过 torch/clip 重型依赖）
          pip install requests urllib3 fake-useragent loguru tqdm Pillow numpy
          pip install pytest pytest-cov pytest-mock tomli
          pip install ruff

      - name: Install optional lightweight dependencies
        run: |
          pip install trafilatura || true
          pip install pybloom-live || true
          pip install curl_cffi || true

      - name: CLI smoke (no optional extras required)
        run: |
          PYTHONPATH=. python -m smart_spider.cli --help
          PYTHONPATH=. python -m smart_spider.cli dataset --help
          PYTHONPATH=. python -m smart_spider.cli browse --help
          PYTHONPATH=. python -m smart_spider.dataset_cli --help
          PYTHONPATH=. python -m smart_spider.multimodal_cli --help
          PYTHONPATH=. python -m smart_spider.dataset_filter_cli --help
          PYTHONPATH=. python spider.py --help
          PYTHONPATH=. python -c "from smart_spider.report import UnifiedReport; from smart_spider.config_io import load_mapping; print('p0-imports-ok')"

      - name: Scene gate truth regression
        run: |
          PYTHONPATH=. pytest tests/test_scene_gate_truth.py tests/test_contract_validate.py tests/test_report.py tests/test_config_io.py tests/test_repository_crash_e2e.py -q --tb=short

      - name: CLIP-gate stub and engine HTML fixtures (no torch)
        run: |
          PYTHONPATH=. pytest tests/test_clip_gate_stub.py tests/test_engine_html_fixtures.py tests/test_dataset_split.py tests/test_cli.py tests/test_browser_playbook.py tests/test_report.py tests/test_site_profile.py tests/test_worker.py tests/test_pipeline_plugins.py -q --tb=short

      - name: Run tests (optional ML dependencies skipped)
        run: |
          # CLIP/torch tests self-skip when heavyweight ML dependencies are absent.
          pytest tests/ -v --tb=short \
            --ignore=tests/test_http_client.py \
            -k "not TestSmartHttpClient" \
            --cov=smart_spider \
            --cov-report=xml \
            --cov-report=term-missing
        env:
          PYTHONPATH: .

      - name: Run HTTP client tests
        run: |
          pytest tests/test_http_client.py -v --tb=short
        env:
          PYTHONPATH: .

      - name: Compile and lint optimized pipeline modules
        run: |
          python -m compileall -q smart_spider
          ruff check \
            smart_spider/dataset_repository.py \
            smart_spider/dataset_state.py \
            smart_spider/dataset_crawler.py \
            smart_spider/http_client.py \
            smart_spider/url_policy.py \
            smart_spider/scene_quality.py \
            smart_spider/multimodal_sources.py \
            smart_spider/multimodal_job.py \
            smart_spider/dataset_filter_cli.py \
            tests/test_dataset_repository.py \
            tests/test_scene_quality.py \
            tests/test_http_client.py \
            tests/test_multimodal_sources.py \
            --select=E,W,F --ignore=E501

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff
      - name: Ruff check optimized pipeline
        run: |
          ruff check \
            smart_spider/dataset_repository.py \
            smart_spider/dataset_state.py \
            smart_spider/dataset_crawler.py \
            smart_spider/http_client.py \
            smart_spider/url_policy.py \
            smart_spider/scene_quality.py \
            smart_spider/multimodal_sources.py \
            smart_spider/multimodal_job.py \
            smart_spider/dataset_filter_cli.py \
            tests/test_dataset_repository.py \
            tests/test_scene_quality.py \
            tests/test_http_client.py \
            tests/test_multimodal_sources.py \
            --select=E,W,F --ignore=E501
      - name: Report existing Ruff debt
        continue-on-error: true
        run: ruff check smart_spider/ tests/ spider.py --select=E,W,F --ignore=E501
